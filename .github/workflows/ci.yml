# CI: build and test.
#
# Adapted from the amal66/mike fork's .github/workflows/ci.yml (monorepo
# layout) to this repository's backend/ + frontend/ layout. Both test steps
# run the coverage-ratchet variant and FAIL when a suite or a coverage floor
# regresses — the `--if-present` escape hatches from the pre-harness era are
# gone, so a renamed or missing test script breaks the build instead of
# silently skipping the suite. Beyond the fork version this also builds the
# frontend (placeholder NEXT_PUBLIC_* env — verified sufficient for
# `next build`) and runs eslint as a blocking gate (the error backlog is at
# zero).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, codex/mac-app-integration]

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Git's line-level merge can splice both sides of package(-lock).json
      # into invalid JSON without a conflict (bit PR #233). npm's own error
      # for an unparseable lockfile is the misleading "npm ci can only
      # install with an existing package-lock.json" — fail fast with the real
      # reason instead.
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - run: npm ci

      # Runs the suite WITH the coverage-ratchet floors from
      # vitest.config.mts (see its thresholds comment): a coverage drop
      # fails CI, same as the frontend job below. This step ran plain
      # `npm test --if-present` from 2026-07-22 to 2026-08-27, so the
      # backend ratchet existed but was never enforced — the floors below
      # were re-measured and raised when this gate was wired up.
      - run: npm run test:coverage

      - run: npm run build

      # `npm run build` (tsc -p tsconfig.json) deliberately excludes the test
      # files so they never reach dist/, which left them entirely unchecked.
      # tsconfig.test.json re-includes them with noEmit, so a stale mock
      # signature fails the build instead of silently passing at runtime.
      - run: npm run typecheck:test

      - run: npm run typecheck:contracts

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same silent-merge-corruption guard as the backend job.
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - run: npm ci

      # Runs the suite with the coverage-ratchet floor check (see
      # docs/frontend-testing.md). `--if-present` used to sit here as a
      # pre-harness fallback: if "test:coverage" were ever renamed or
      # dropped, npm would exit 0 and the whole frontend suite would vanish
      # from CI behind a green check. The script has existed since the
      # harness landed, so the fallback buys nothing but that silence — it
      # is gone, same as the backend job's.
      - run: npm run test:coverage

      # Blocking gate: the eslint error backlog was burned down in this PR
      # (0 errors; warnings do not fail the step), so any new error fails CI.
      - run: npm run lint

      # Type-checks the whole program, tests included. `next build` below
      # checks only tsconfig.build.json, which excludes test files so the
      # production image never depends on fixtures outside frontend/ (see
      # frontend/src/__tests__/architecture.test.ts). Vitest strips types
      # without checking them, so this step is the only gate on test type
      # errors.
      - run: npm run typecheck

      # Production build. Runtime-only server configuration is intentionally
      # not required for this compile-time check.
      # This catches type errors (next build runs tsc) and broken routes/imports.
      - run: npm run build

      # Bundles every web and cross-target UI story. Type-level drift is caught
      # by the production build above; this catches broken story imports and
      # Ladle configuration. The script is required infrastructure, so its
      # accidental removal must fail CI rather than silently skip this gate.
      - run: npm run catalog:build
