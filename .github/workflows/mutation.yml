# Mutation testing: prove the security-critical unit tests assert behavior.
#
# Stryker mutates the security-critical modules listed in
# backend/stryker.config.json (access control, download-token signing,
# citation extraction + verification, the SSRF IP guard) and re-runs the
# vitest suite per mutant. A surviving mutant = a behavior change (e.g. an
# access check inverted, a blocked IP range allowed) that no test caught.
#
# ON-DEMAND + monthly cron, NOT a PR gate. It was going to become a
# path-filtered PR gate in this PR (the step docs/test-depth.md named as the
# natural next stage, and a measured run takes ~2 minutes, not the ~10 the
# original header guessed). That promotion is held back because the harness
# cannot currently produce a real score: @stryker-mutator/vitest-runner 10
# does not work with vitest 5, which landed in #455 on 2026-09-11. The
# runner starts the mutant runs but reads back zero test results, so every
# mutant is scored "survived" and the total is 0.00 — a red run that says
# "your tests collapsed" when nothing about the tests changed. Gating PRs on
# that would be worse than not gating them at all.
#
# The last honest score is the 2026-09-03 cron run (green, on vitest 4).
# docs/test-depth.md records the evidence and the revival condition; when
# @stryker-mutator/* ships vitest 5 support, bump it, confirm a real score
# locally, and add the `pull_request:` trigger with a path filter matching
# the `mutate` array in backend/stryker.config.json.
#
# `thresholds.break` in stryker.config.json fails any run whose score
# regresses below the documented floor. See docs/test-depth.md.
name: Mutation testing

on:
  workflow_dispatch:
  schedule:
    # Monthly, on the 3rd at 06:17 UTC (odd minute to dodge the top-of-hour
    # GitHub cron rush). Drift check only — failures show up in the Actions
    # tab, they block nothing.
    - cron: "17 6 3 * *"

jobs:
  mutation:
    name: Backend mutation testing (security libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Same silent-merge-corruption guard as ci.yml (bit PR #233).
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - run: npm ci

      - run: npm run test:mutation

      # The HTML report is the useful output: per-file, per-mutant detail
      # of what survived. Upload even when the score check fails — a failed
      # run is exactly when you want to read it.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: backend/reports/mutation/
          if-no-files-found: warn
