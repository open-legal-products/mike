# Mutation testing: prove the security-critical unit tests assert behavior.
#
# Stryker mutates the security-critical modules listed in
# backend/stryker.config.json (access control, download-token signing,
# citation extraction + verification, the SSRF IP guard) and re-runs the
# vitest suite per mutant. A surviving mutant = a behavior change (e.g. an
# access check inverted, a blocked IP range allowed) that no test caught.
#
# Runs as a PR gate ONLY when those modules, their tests, or this harness
# change — the path filter below keeps it off unrelated PRs. This is the
# "mutation testing on changed security-lib files in PRs" step that
# docs/test-depth.md named as the natural next stage; a measured run takes
# ~2 minutes (the original ~10-minute estimate predated measurement — this
# workflow had never actually executed before 2026-08-27). The monthly cron
# still catches drift that lands between such PRs, and
# `thresholds.break` in stryker.config.json fails any run whose score
# regresses below the documented floor. See docs/test-depth.md.
name: Mutation testing

on:
  workflow_dispatch:
  pull_request:
    branches: [main, upstream-main]
    # Keep this list in sync with the `mutate` array in
    # backend/stryker.config.json, plus the tests that kill those mutants
    # and the harness itself.
    paths:
      - backend/src/lib/access.ts
      - backend/src/lib/downloadTokens.ts
      - backend/src/lib/privateIp.ts
      - backend/src/lib/chat/citations.ts
      - backend/src/lib/chat/verifyCitations.ts
      - backend/src/lib/__tests__/access.test.ts
      - backend/src/lib/__tests__/downloadTokens.test.ts
      - backend/src/lib/__tests__/privateIp.test.ts
      - backend/src/lib/__tests__/citations.test.ts
      - backend/src/lib/chat/verifyCitations.test.ts
      - backend/src/lib/mcp/__tests__/client.ssrf.test.ts
      - backend/stryker.config.json
      - .github/workflows/mutation.yml
  schedule:
    # Monthly, on the 3rd at 06:17 UTC (odd minute to dodge the top-of-hour
    # GitHub cron rush). Drift check only — failures show up in the Actions
    # tab, they block nothing.
    - cron: "17 6 3 * *"

jobs:
  mutation:
    name: Backend mutation testing (security libs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # Same silent-merge-corruption guard as ci.yml (bit PR #233).
      - name: Validate package.json and lockfile parse
        run: node -e "for (const f of ['package.json','package-lock.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"

      - run: npm ci

      - run: npm run test:mutation

      # The HTML report is the useful output: per-file, per-mutant detail
      # of what survived. Upload even when the score check fails — a failed
      # run is exactly when you want to read it.
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: backend/reports/mutation/
          if-no-files-found: warn
