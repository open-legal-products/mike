# CodeQL: static analysis for the whole tree (backend/ + frontend/).
#
# Both halves are interpreted TypeScript, so CodeQL's `build-mode: none`
# extracts them straight from source — no npm ci, no build step, and no
# autobuild guessing at the two-package layout. One analyze job covers
# backend and frontend together. The weekly cron re-runs analysis on an
# otherwise-quiet tree so newly shipped CodeQL queries still get applied.
# Findings land in the Security tab (code scanning), not as CI noise.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    # Validate stacked PRs targeting feature branches as well as main.
  schedule:
    # Mondays 04:30 UTC.
    - cron: "30 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    # Runs here and in forks; skipped in copies such as the Vercel Deploy button makes (docs/vercel.md).
    if: github.repository == 'open-legal-products/mike' || github.event.repository.fork
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload results to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: "/language:javascript-typescript"
