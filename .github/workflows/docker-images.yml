# Docker images: build every Dockerfile the way a fresh install does.
#
# The CI job that runs `next build` on a full checkout cannot see a source
# file reaching outside its Docker build context: every sibling directory
# exists on the runner, so the import resolves. The image is the only place it
# does not, and until this workflow nothing built the image before merge. Main
# shipped with an unbuildable frontend image three times for that reason
# (24dc0f97 on 2026-08-21, #457 on 2026-09-12, #501 on 2026-09-20), each found
# by someone running `docker compose up --build` on a fresh clone.
#
# Each image is built with the same context, Dockerfile, and per-Dockerfile
# ignore file docker-compose.yml and docs/deployment.md use, and nothing is
# pushed. Layers are cached in the GitHub Actions cache so the `npm ci` and
# apt layers are paid once per lockfile change, not once per run.
name: Docker images

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Include stacked PRs whose base is another feature branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: word-addin
            context: .
            dockerfile: word-addin/Dockerfile
            # The production webpack build refuses to run without the web app
            # URL (word-addin/webpack.config.js). Placeholder values, as the
            # word-addin workflow uses for its own build; nothing is deployed.
            build_args: |
              REACT_APP_WEB_APP_URL=https://app.example.com
              WORD_ADDIN_PUBLIC_URL=https://word.example.com
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: ${{ matrix.image == 'backend' }}
          tags: mike-${{ matrix.image }}:ci
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # The sandbox suite needs the Pyodide wheels and Chromium, which only the
      # backend image has; it runs there, without network, as the sandbox
      # service does. Loopback still works, so the test's socket listener does.
      - name: Sandbox tests in the image
        if: matrix.image == 'backend'
        run: >
          docker run --rm --network none --cap-drop ALL
          -e REQUIRE_PYODIDE=1 -e NODE_ENV=test
          mike-backend:ci npx vitest run src/lib/sandbox

      # The self-test under the sandbox service's constraints from
      # docker-compose.yml: read-only, non-root, no capabilities, tmpfs /tmp.
      - name: Sandbox self-test in the image
        if: matrix.image == 'backend'
        run: >
          docker run --rm --network none --read-only --tmpfs /tmp
          --cap-drop ALL --security-opt no-new-privileges --user mikesandbox
          -e HOME=/tmp mike-backend:ci node dist/sandbox/selfTest.js
