# Docker images: build every Dockerfile the way a fresh install does.
#
# The CI job that runs `next build` on a full checkout cannot see a source
# file reaching outside its Docker build context: every sibling directory
# exists on the runner, so the import resolves. The image is the only place it
# does not, and until this workflow nothing built the image before merge. Main
# shipped with an unbuildable frontend image three times for that reason
# (24dc0f97 on 2026-08-21, #457 on 2026-09-12, #501 on 2026-09-20), each found
# by someone running `docker compose up --build` on a fresh clone.
#
# Each image is built with the same context, Dockerfile, and per-Dockerfile
# ignore file docker-compose.yml and docs/deployment.md use, and nothing is
# pushed (publish-images.yml publishes; it never runs on pull requests). Layers are cached in the GitHub Actions cache so the `npm ci` and
# apt layers are paid once per lockfile change, not once per run.
name: Docker images

on:
  workflow_dispatch:
  push:
    branches: [main]
  # Include stacked PRs whose base is another feature branch.
  pull_request:

permissions:
  contents: read

concurrency:
  group: docker-images-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: frontend
            context: .
            dockerfile: frontend/Dockerfile
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: word-addin
            context: .
            dockerfile: word-addin/Dockerfile
            # The production webpack build refuses to run without the web app
            # URL (word-addin/webpack.config.js). Placeholder values, as the
            # word-addin workflow uses for its own build; nothing is deployed.
            build_args: |
              REACT_APP_WEB_APP_URL=https://app.example.com
              WORD_ADDIN_PUBLIC_URL=https://word.example.com
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # The backend image is loaded so the next step can run it.
          load: ${{ matrix.image == 'backend' }}
          tags: mike-${{ matrix.image }}:ci
          # GIT_SHA becomes the Sentry release (docs/observability.md); an
          # image without it reports events nobody can map to a commit.
          build-args: |
            GIT_SHA=${{ github.sha }}
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Compose's storage-cors job runs docker/storage-cors.mjs inside this
      # image against its compiled /app/dist/lib/origins.js (CommonJS) to
      # write the bucket CORS policy. Run it the same way, with no network,
      # so an image that stops shipping that module, or a change to its
      # shape, fails here instead of on a fresh install's first upload.
      - name: storage-cors policy from the built backend image
        if: matrix.image == 'backend'
        run: |
          policy=$(docker run --rm --network none \
            -v "$PWD/docker/storage-cors.mjs:/storage-cors.mjs:ro" \
            -e NODE_ENV=production \
            -e FRONTEND_URL=https://mike.example.com \
            -e ALLOWED_ORIGINS=https://word.example.com \
            -e MIKE_ORIGINS_MODULE=/app/dist/lib/origins.js \
            --entrypoint node mike-backend:ci /storage-cors.mjs 2>stderr.txt)
          cat stderr.txt
          echo "$policy"
          test ! -s stderr.txt
          echo "$policy" | jq -e '.CORSRules[0].AllowedOrigins == ["https://mike.example.com","https://word.example.com"]'
