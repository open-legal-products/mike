apiVersion: v1
kind: Service
metadata:
  name: {{ include "mike.db" . }}
  labels: {{- include "mike.labels" . | nindent 4 }}
spec:
  ports:
    - port: 5432
      targetPort: postgres
      name: postgres
  selector:
    {{- include "mike.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mike.db" . }}
  labels: {{- include "mike.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "mike.db" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "mike.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        {{- include "mike.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db
    spec:
      initContainers:
        # The volume is created owned by root, and postgres refuses to start on
        # a data directory it does not own. Chowning by NAME rather than uid
        # uses the image's own passwd entry, so this stays correct if the image
        # ever renumbers the postgres user.
        - name: fix-data-ownership
          image: {{ .Values.postgres.image }}
          securityContext:
            runAsUser: 0
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              chown -R postgres:postgres /var/lib/postgresql/data
              chmod 700 /var/lib/postgresql/data

              # A data directory with contents but no PG_VERSION is not a
              # database: initdb refuses to run into a non-empty directory, and
              # the server then dies on the missing file. Say so here, because
              # postgres reports it as "is not a valid data directory" several
              # restarts later.
              if [ ! -f /var/lib/postgresql/data/PG_VERSION ] \
                 && [ -n "$(ls -A /var/lib/postgresql/data)" ]; then
                echo "ERROR: /var/lib/postgresql/data has contents but no PG_VERSION," >&2
                echo "so no database was ever initialised here. Contents:" >&2
                ls -A /var/lib/postgresql/data >&2
                echo "Delete the claim (kubectl delete pvc data-<release>-db-0) and redeploy." >&2
                exit 1
              fi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: JWT_SECRET
            - name: JWT_EXP
              value: "3600"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/zz-roles.sql
              subPath: roles.sql
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 60
            periodSeconds: 20
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: init
          configMap:
            name: {{ include "mike.fullname" . }}-db-sql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
