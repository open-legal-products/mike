<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leatherBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4C86C4"/>
      <stop offset="0.4" stop-color="#1F5B9D"/>
      <stop offset="1" stop-color="#143259"/>
    </linearGradient>
    <linearGradient id="leatherRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C45A5F"/>
      <stop offset="0.4" stop-color="#A0232C"/>
      <stop offset="1" stop-color="#5E1921"/>
    </linearGradient>
    <linearGradient id="leatherGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA578"/>
      <stop offset="0.4" stop-color="#1E6D4F"/>
      <stop offset="1" stop-color="#173F31"/>
    </linearGradient>
    <linearGradient id="pages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF0"/>
      <stop offset="0.55" stop-color="#F4EAD2"/>
      <stop offset="1" stop-color="#DCCBA4"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1A0D05" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7DE9C"/>
      <stop offset="0.5" stop-color="#D9A94E"/>
      <stop offset="1" stop-color="#B07E2C"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="sheen">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- bottom: blue book, spine left, with a ribbon marker -->
  <g>
    <rect x="5" y="44" width="54" height="14" rx="3" fill="url(#leatherBlue)" stroke="url(#rim)" stroke-width="1.4"/>
    <rect x="15" y="47.75" width="42" height="6.5" rx="1.2" fill="url(#pages)"/>
    <g stroke="#C9B48A" stroke-width="0.5" opacity="0.8">
      <path d="M16 50 H56"/><path d="M16 52 H56"/>
    </g>
    <rect x="8.2" y="46.5" width="1.4" height="9" rx="0.7" fill="url(#gilt)"/>
    <rect x="11.4" y="46.5" width="1.4" height="9" rx="0.7" fill="url(#gilt)"/>
    <ellipse cx="22" cy="45.3" rx="12" ry="1.1" fill="url(#sheen)" opacity="0.45"/>
    <path d="M40 55.5 V62 L42 60.4 L44 62 V55.5 Z" fill="url(#ribbon)"/>
  </g>

  <!-- middle: red book, spine right -->
  <g transform="rotate(-3 32 44)">
    <rect x="8" y="30" width="49" height="14" rx="3" fill="url(#leatherRed)" stroke="url(#rim)" stroke-width="1.4"/>
    <rect x="10" y="33.75" width="36" height="6.5" rx="1.2" fill="url(#pages)"/>
    <g stroke="#C9B48A" stroke-width="0.5" opacity="0.8">
      <path d="M11 36 H45"/><path d="M11 38 H45"/>
    </g>
    <rect x="49.2" y="32.5" width="1.4" height="9" rx="0.7" fill="url(#gilt)"/>
    <rect x="52.4" y="32.5" width="1.4" height="9" rx="0.7" fill="url(#gilt)"/>
    <ellipse cx="42" cy="31.3" rx="11" ry="1.1" fill="url(#sheen)" opacity="0.45"/>
  </g>

  <!-- top: green book, spine left -->
  <g transform="rotate(2.5 31 30)">
    <rect x="9" y="16" width="44" height="14" rx="3" fill="url(#leatherGreen)" stroke="url(#rim)" stroke-width="1.4"/>
    <rect x="18" y="19.75" width="33" height="6.5" rx="1.2" fill="url(#pages)"/>
    <g stroke="#C9B48A" stroke-width="0.5" opacity="0.8">
      <path d="M19 22 H50"/><path d="M19 24 H50"/>
    </g>
    <rect x="12.2" y="18.5" width="1.4" height="9" rx="0.7" fill="url(#gilt)"/>
    <rect x="15.4" y="18.5" width="1.4" height="9" rx="0.7" fill="url(#gilt)"/>
    <ellipse cx="24" cy="17.3" rx="11" ry="1.1" fill="url(#sheen)" opacity="0.5"/>
  </g>
</svg>
