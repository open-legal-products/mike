<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none" role="img" aria-labelledby="ideTitle">
  <title id="ideTitle">Integrated Drafting Environment</title>
  <defs>
    <linearGradient id="ideFiles" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FA6EC" stop-opacity="0.97"/>
      <stop offset="0.5" stop-color="#6C98E8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#5B8AE2" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="ideDocument" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9AA3B2" stop-opacity="0.97"/>
      <stop offset="0.5" stop-color="#909AAA" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#838E9F" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="ideAssistant" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9C83EE" stop-opacity="0.97"/>
      <stop offset="0.5" stop-color="#9073EA" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#8264E3" stop-opacity="0.97"/>
    </linearGradient>
    <linearGradient id="ideRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#374151" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="ideSheen" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="ideClipLeft"><rect x="24" y="36" width="36" height="168" rx="13"/></clipPath>
    <clipPath id="ideClipMiddle"><rect x="90" y="36" width="60" height="168" rx="13"/></clipPath>
    <clipPath id="ideClipRight"><rect x="180" y="36" width="36" height="168" rx="13"/></clipPath>
  </defs>
  <!-- files -->
  <g>
    <rect x="24" y="36" width="36" height="168" rx="13" fill="url(#ideFiles)" stroke="url(#ideRim)" stroke-width="5"/>
    <path d="M24 36 H60 V96 C49.92 116 34.08 116 24 92 Z" fill="url(#ideSheen)" clip-path="url(#ideClipLeft)"/>
    <rect x="22" y="34" width="40" height="172" rx="15" fill="none" stroke="#34528A" stroke-width="3" opacity="0.9"/>
  </g>
  <!-- document -->
  <g>
    <rect x="90" y="36" width="60" height="168" rx="13" fill="url(#ideDocument)" stroke="url(#ideRim)" stroke-width="5"/>
    <path d="M90 36 H150 V100 C133.2 120 106.8 120 90 96 Z" fill="url(#ideSheen)" clip-path="url(#ideClipMiddle)"/>
    <rect x="88" y="34" width="64" height="172" rx="15" fill="none" stroke="#444D5C" stroke-width="3" opacity="0.9"/>
  </g>
  <!-- assistant -->
  <g>
    <rect x="180" y="36" width="36" height="168" rx="13" fill="url(#ideAssistant)" stroke="url(#ideRim)" stroke-width="5"/>
    <path d="M180 36 H216 V96 C205.92 116 190.08 116 180 92 Z" fill="url(#ideSheen)" clip-path="url(#ideClipRight)"/>
    <rect x="178" y="34" width="40" height="172" rx="15" fill="none" stroke="#4F3A92" stroke-width="3" opacity="0.9"/>
  </g>
</svg>
